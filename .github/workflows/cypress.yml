
name: Cypress Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes Cypress
        run: npm test

      - name: Salvar relatorios e evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-cypress
          path: |
            cypress/reports/
            cypress/videos/
            cypress/screenshots/
          if-no-files-found: warn
          retention-days: 90
